<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null_X - Sign In</title>
    <style>
        :root {
            --bg-color: #0b0314;
            --container-bg: #140e24;
            --border-color: #8b3dff;
            --text-color: #ffffff;
            --text-secondary: #b3a1cf;
            --btn-primary: #8b3dff;
            --btn-secondary: #251b40;
            --input-bg: #1c1433;
            --input-border: #3b2d66;
            --error-color: #ff4a4a;
            --success-color: #00ff66;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 0 25px rgba(139, 61, 255, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .status-badge {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--success-color);
            text-transform: uppercase;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .tab-container {
            display: flex;
            background-color: var(--btn-secondary);
            border-radius: 10px;
            margin-bottom: 30px;
            padding: 5px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--btn-primary);
            color: var(--text-color);
            font-weight: bold;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        /* Utility class to hide elements smoothly */
        .hidden {
            display: none;
        }

        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        .password-input {
            padding-right: 40px;
        }

        input:focus {
            border-color: var(--border-color);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--text-color);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #8b3dff, #b370ff);
            border: none;
            color: var(--text-color);
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(139, 61, 255, 0.4);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .message-box {
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .error-msg { color: var(--error-color); }
        .success-msg { color: var(--success-color); }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Null_X</h1>
        <div class="subtitle">Sign in for brand new features</div>
        <div class="status-badge" id="statusBadge">Direct Engine Active</div>

        <div class="tab-container">
            <button class="tab-btn active" id="tabCreate" onclick="setMode('signup')">Create Account</button>
            <button class="tab-btn" id="tabLogin" onclick="setMode('login')">Login</button>
        </div>

        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="form-group" id="handlerGroup">
                <label for="handler">Handler</label>
                <input type="text" id="handler" placeholder="@your_handler" autocomplete="off" maxlength="20">
            </div>

            <div class="form-group">
                <label id="usernameLabel" for="username">Display Name</label>
                <input type="text" id="username" required autocomplete="username" maxlength="22">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="password-input" required autocomplete="current-password">
                    <span class="toggle-password" onclick="togglePasswordVis()">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
        </form>

        <div class="message-box" id="messageBox"></div>
    </div>

        <script src="https://cdn.jsdelivr.net/gh/Null-X-Team/badwordfilter@main/badword.js"></script>
    <script src="username-filter.js"></script>
    <script>
        // --- CONFIGURATION ---
        const SUPABASE_PROJECT_URL = 'https://ldojzaikkolrxkiwyqvq.supabase.co';
        const RPC_URL = `${SUPABASE_PROJECT_URL}/rest/v1/rpc/verify_user_login`;
        const SIGNUP_RPC_URL = `${SUPABASE_PROJECT_URL}/rest/v1/rpc/register_user_hashed`;
        
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxkb2p6YWlra29scnhraXd5cXZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDM2NjksImV4cCI6MjA5NDg3OTY2OX0.CXZf1jaNJ3njQhIWoaYFxuJWx2J0HQ9CPF5imQoxtMw';

        const headers = {
            'apikey': ANON_KEY,
            'Authorization': `Bearer ${ANON_KEY}`,
            'Content-Type': 'application/json'
        };

        let currentMode = 'signup';

        // --- INTERFACE UTILITIES ---
        function setMode(mode) {
            currentMode = mode;
            const tabCreate = document.getElementById('tabCreate');
            const tabLogin = document.getElementById('tabLogin');
            const submitBtn = document.getElementById('submitBtn');
            const handlerGroup = document.getElementById('handlerGroup');
            const handlerInput = document.getElementById('handler');
            const usernameLabel = document.getElementById('usernameLabel');
            
            document.getElementById('messageBox').textContent = '';

            if (mode === 'signup') {
                tabCreate.classList.add('active');
                tabLogin.classList.remove('active');
                submitBtn.textContent = 'Create Account';
                
                // Show handler field for signup
                handlerGroup.classList.remove('hidden');
                handlerInput.required = true;
                usernameLabel.textContent = 'Display Name';
            } else {
                tabLogin.classList.add('active');
                tabCreate.classList.remove('active');
                submitBtn.textContent = 'Login';
                
                // Hide handler field for login (assume they log in with Display Name or you can change to Handler)
                handlerGroup.classList.add('hidden');
                handlerInput.required = false;
                usernameLabel.textContent = 'Display Name or Handler';
            }
        }

        function togglePasswordVis() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        }

        function showMessage(text, isError = true) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = text;
            msgBox.className = isError ? 'message-box error-msg' : 'message-box success-msg';
        }

        // --- REQUEST ROUTER ---
                function handleSubmit(event) {
            event.preventDefault();
            const userVal = document.getElementById('username').value.trim();
            let handlerVal = document.getElementById('handler').value.trim();
            const passVal = document.getElementById('password').value;

            if (userVal.length > 22) {
                showMessage('Display name cannot exceed 22 characters.');
                return;
            }

            if (currentMode === 'signup') {
                // Format handler to ensure it starts with @
                if (!handlerVal.startsWith('@')) {
                    handlerVal = '@' + handlerVal;
                }
                
                if (handlerVal.length < 3) {
                    showMessage('Handler must be at least 2 characters long.');
                    return;
                }

                // Block inappropriate display names / handlers (badwordfilter)
                if (typeof window.nxUsernameIsClean === 'function') {
                    if (!window.nxUsernameIsClean(userVal)) {
                        showMessage('Display name contains inappropriate language. Please choose another.');
                        return;
                    }
                    if (!window.nxUsernameIsClean(handlerVal)) {
                        showMessage('Handler contains inappropriate language. Please choose another.');
                        return;
                    }
                } else if (typeof window.containsBadWords === 'function') {
                    const bareHandler = handlerVal.replace(/^@+/, '');
                    if (window.containsBadWords(userVal) || window.containsBadWords(bareHandler) || window.containsBadWords(handlerVal)) {
                        showMessage('That name is not allowed. Please choose a different username/handler.');
                        return;
                    }
                }
                
                handleSignUp(userVal, handlerVal, passVal);
            } else {
                // For login, we just pass what they typed into the username box 
                // (which could be a handler or a username depending on your backend setup)
                handleLogin(userVal, passVal);
            }
        }

        // --- HASHED SIGN UP ROUTINE ---
        async function handleSignUp(username, handler, password) {
            try {
                // Payload now includes new_handler
                const response = await fetch(SIGNUP_RPC_URL, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ 
                        new_username: username, 
                        new_handler: handler,
                        new_password: password 
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    
                    // Catch unique constraint errors based on Supabase RPC feedback
                    if (errorData.message && errorData.message.includes('Username is already taken')) {
                        showMessage('Display Name is already taken!');
                    } else if (errorData.message && errorData.message.includes('Handler is already taken')) {
                        showMessage('That Handler is already in use!');
                    } else {
                        showMessage('Registration failed. Name or Handler might be taken.');
                    }
                    return;
                }

                // Store handler instead of display name for chat logic if you prefer
                localStorage.setItem('chatUser', handler);
                showMessage('Account created successfully! Logging you in...', false);
                
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1500);

            } catch (err) {
                showMessage('Connection error: ' + err.message);
                console.error(err);
            }
        }

        // --- HASHED LOGIN ROUTINE ---
        async function handleLogin(username, password) {
            try {
                const response = await fetch(RPC_URL, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ 
                        login_username: username, 
                        login_password: password 
                    })
                });
                
                if (!response.ok) throw new Error(`Verification endpoint offline.`);
                const isValid = await response.json();

                if (isValid === true) {
                    showMessage('Login successful! Redirecting...', false);
                    localStorage.setItem('chatUser', username);
                    
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 1500);
                } else {
                    showMessage('Incorrect credentials.');
                }
            } catch (err) {
                showMessage('Connection error: ' + err.message);
                console.error(err);
            }
        }
    </script>
</body>
</html>
