<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glaxyias Unblocked</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="newpage.css">
</head>
<body>

    <div class="top-nav-container">
        <nav class="nav-bar">
            <div class="nav-trigger-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>
            
            <div class="nav-tabs-wrapper">
                <a href="#" class="nav-tab-item">
                    <span class="tab-icon"><i class="fa-solid fa-crosshairs"></i></span>
                    <span class="tab-text">Home</span>
                </a>
                <a href="#" class="nav-tab-item active">
                    <span class="tab-icon"><i class="fa-solid fa-gamepad"></i></span>
                    <span class="tab-text">Games</span>
                </a>
                <a href="#" class="nav-tab-item">
                    <span class="tab-icon"><i class="fa-solid fa-star"></i></span>
                    <span class="tab-text">Favorites</span>
                </a>
                <a href="#" class="nav-tab-item">
                    <span class="tab-icon"><i class="fa-solid fa-shield-halved"></i></span>
                    <span class="tab-text">Unblockers</span>
                </a>
                <a href="#" class="nav-tab-item">
                    <span class="tab-icon"><i class="fa-solid fa-user"></i></span>
                    <span class="tab-text">Profile</span>
                </a>
                <a href="#" class="nav-tab-item">
                    <span class="tab-icon"><i class="fa-solid fa-comments"></i></span>
                    <span class="tab-text">Communications</span>
                </a>
                <a href="#" class="nav-tab-item">
                    <span class="tab-icon"><i class="fa-solid fa-terminal"></i></span>
                    <span class="tab-text">Terminal</span>
                </a>
            </div>
        </nav>
    </div>

    <div class="dashboard-wrapper">

        <aside class="side-panel left-panel">
            <div class="widget-header">
                <i class="fa-solid fa-cloud-sun"></i> Weather
            </div>
            <div class="weather-row">
                <div class="weather-main">
                    <span class="weather-temp">77°</span>
                </div>
                <div class="weather-stats">
                    <span><i class="fa-solid fa-droplet"></i> 2% Humidity</span>
                    <span class="location-label">Atlanta</span>
                </div>
            </div>
        </aside>

        <main class="main-hub">
            <h1 class="site-title">Glaxyias Unblocked</h1>
            
            <div class="search-container">
                <span class="search-glass"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" placeholder="Search games...">
            </div>
            
            <div class="apps-grid">
                <div class="app-card">
                    <div class="app-icon-box fn-bg"><i class="fa-solid fa-crosshairs"></i></div>
                    <span class="app-label">Home</span>
                </div>
                <div class="app-card">
                    <div class="app-icon-box gm-bg"><i class="fa-solid fa-gamepad"></i></div>
                    <span class="app-label">Games</span>
                </div>
                <div class="app-card">
                    <div class="app-icon-box mv-bg"><i class="fa-solid fa-star"></i></div>
                    <span class="app-label">Favorites</span>
                </div>
                <div class="app-card">
                    <div class="app-icon-box ai-bg"><i class="fa-solid fa-shield-halved"></i></div>
                    <span class="app-label">Unblockers</span>
                </div>
                <div class="app-card">
                    <div class="app-icon-box ms-bg"><i class="fa-solid fa-user"></i></div>
                    <span class="app-label">Profile</span>
                </div>
                <div class="app-card">
                    <div class="app-icon-box rb-bg"><i class="fa-solid fa-comments"></i></div>
                    <span class="app-label">Communications</span>
                </div>
            </div>
        </main>

        <aside class="side-panel right-panel">
            <div class="widget-header">
                <i class="fa-solid fa-star"></i> Featured
            </div>
            <div class="featured-content">
                <div class="featured-preview-box">
                    <span class="preview-placeholder"><i class="fa-solid fa-gamepad"></i></span>
                </div>
                <h3>Featured Game</h3>
                <p>Play our top picked game of the week instantly.</p>
                <a href="#" class="widget-btn">Play Now</a>
            </div>
        </aside>

    </div>

</body>
</html>
