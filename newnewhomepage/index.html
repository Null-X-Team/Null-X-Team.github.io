<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null-X Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">
                <span class="logo">NULL-X</span>
            </div>
            <div class="nav-divider"></div>
        </nav>

        <main class="main-content">
            <section class="hero">
                <h1>Portal</h1>
                <p>Fast proxy access to any website</p>
            </section>

            <section class="proxy-section">
                <div class="proxy-card">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="urlInput" 
                            class="url-input" 
                            placeholder="Enter a website..."
                            autocomplete="off"
                        >
                        <button class="search-btn" id="proxyBtn">Go</button>
                    </div>
                    <div class="quick-links">
                        <a href="#" class="quick-link" data-url="google.com">Google</a>
                        <a href="#" class="quick-link" data-url="youtube.com">YouTube</a>
                        <a href="#" class="quick-link" data-url="github.com">GitHub</a>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Null-X Team</p>
        </footer>
    </div>

    <script src="proxy.js"></script>
</body>
</html>
