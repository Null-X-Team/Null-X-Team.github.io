<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/clover-pit@main/">

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Unity Web Player | CloverPit</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes"
  >
</head>

<body>

  <div
    id="loading-text"
    style="
      color: white;
      font-size: 48px;
      font-family: cursive;
      text-align: center;
      margin-top: 20px;
    "
  >
    LOADING...
  </div>

  <div id="unity-container">

    <canvas
      id="unity-canvas"
      width="960"
      height="540"
      tabindex="-1"
    ></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

  </div>


  <script>

    // ============================================================
    // ELEMENTS
    // ============================================================

    const loadingText =
      document.querySelector("#loading-text");

    const canvas =
      document.querySelector("#unity-canvas");

    const loadingBar =
      document.querySelector("#unity-loading-bar");

    const progressBarFull =
      document.querySelector("#unity-progress-bar-full");

    const warningBanner =
      document.querySelector("#unity-warning");


    // ============================================================
    // SETTINGS
    // ============================================================

    const totalMB = "86.96";

    let loadedBytes = 0;


    // ============================================================
    // ERROR DISPLAY
    // ============================================================

    function showError(message) {

      console.error("[CloverPit]", message);

      loadingText.textContent =
        "FAILED TO LOAD";

      loadingText.style.color =
        "#ff4444";

      unityShowBanner(
        message,
        "error"
      );
    }


    // ============================================================
    // FETCH FILE WITH PROGRESS
    // ============================================================

    async function fetchWithProgress(url) {

      console.log(
        "[CloverPit] Downloading:",
        url
      );

      let response;

      try {

        response = await fetch(url);

      } catch (error) {

        throw new Error(
          `Network error while downloading: ${url}`
        );
      }


      // Check HTTP status.

      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status} ${response.statusText}: ${url}`
        );
      }


      if (!response.body) {

        throw new Error(
          `No response body received: ${url}`
        );
      }


      const reader =
        response.body.getReader();

      const chunks = [];

      let received = 0;


      while (true) {

        const {
          done,
          value
        } = await reader.read();


        if (done) {
          break;
        }


        if (!value) {
          continue;
        }


        received += value.length;

        loadedBytes += value.length;

        chunks.push(value);


        // Update loading text.

        const mbDone =
          (
            loadedBytes /
            (1024 * 1024)
          ).toFixed(2);


        loadingText.textContent =
          `LOADING... ${mbDone} MB / ${totalMB} MB`;
      }


      console.log(
        "[CloverPit] Finished:",
        url,
        `${(received / (1024 * 1024)).toFixed(2)} MB`
      );


      // Combine all chunks.

      const fullBuffer =
        new Uint8Array(received);

      let offset = 0;


      for (const chunk of chunks) {

        fullBuffer.set(
          chunk,
          offset
        );

        offset += chunk.length;
      }


      return fullBuffer.buffer;
    }


    // ============================================================
    // MERGE SPLIT FILES
    //
    // IMPORTANT:
    // We explicitly give the resulting Blob a MIME type.
    // WASM must be application/wasm.
    // ============================================================

    async function mergeFiles(
      fileParts,
      mimeType
    ) {

      console.log(
        "[CloverPit] Merging:",
        fileParts
      );


      const buffers =
        await Promise.all(
          fileParts.map(
            part => fetchWithProgress(part)
          )
        );


      const mergedBlob =
        new Blob(
          buffers,
          {
            type: mimeType
          }
        );


      console.log(
        "[CloverPit] Created Blob:",
        mimeType,
        `${(mergedBlob.size / (1024 * 1024)).toFixed(2)} MB`
      );


      return URL.createObjectURL(
        mergedBlob
      );
    }


    // ============================================================
    // CREATE PART FILE NAMES
    // ============================================================

    function getParts(
      file,
      start,
      end
    ) {

      const parts = [];


      for (
        let i = start;
        i <= end;
        i++
      ) {

        parts.push(
          file + ".part" + i
        );
      }


      return parts;
    }


    // ============================================================
    // UNITY WARNING BANNER
    // ============================================================

    function unityShowBanner(
      msg,
      type
    ) {

      if (!warningBanner) {
        return;
      }


      warningBanner.innerHTML =
        msg;


      warningBanner.style.display =
        "block";


      if (type === "error") {

        warningBanner.style.background =
          "#ff0000";

        warningBanner.style.color =
          "#ffffff";

      } else if (type === "warning") {

        warningBanner.style.background =
          "#ffc107";

        warningBanner.style.color =
          "#000000";

      } else {

        warningBanner.style.background =
          "#333333";

        warningBanner.style.color =
          "#ffffff";
      }
    }


    // ============================================================
    // MAIN
    // ============================================================

    (async function () {

      try {

        console.log(
          "=========================================="
        );

        console.log(
          "[CloverPit] Starting..."
        );

        console.log(
          "=========================================="
        );


        // --------------------------------------------------------
        // FILE PARTS
        // --------------------------------------------------------

        const dataParts =
          getParts(
            "Build/CloverPit.data",
            1,
            3
          );


        const wasmParts =
          getParts(
            "Build/CloverPit.wasm",
            1,
            3
          );


        console.log(
          "[CloverPit] DATA parts:",
          dataParts
        );


        console.log(
          "[CloverPit] WASM parts:",
          wasmParts
        );


        // --------------------------------------------------------
        // DOWNLOAD + MERGE
        // --------------------------------------------------------

        const [
          dataUrl,
          wasmUrl
        ] = await Promise.all([

          // Unity .data file

          mergeFiles(
            dataParts,
            "application/octet-stream"
          ),


          // Unity WebAssembly file
          //
          // THIS IS THE IMPORTANT MIME FIX.

          mergeFiles(
            wasmParts,
            "application/wasm"
          )

        ]);


        console.log(
          "[CloverPit] Game files downloaded."
        );


        console.log(
          "[CloverPit] Data URL:",
          dataUrl
        );


        console.log(
          "[CloverPit] WASM URL:",
          wasmUrl
        );


        // --------------------------------------------------------
        // UNITY BUILD CONFIGURATION
        // --------------------------------------------------------

        const buildUrl =
          "Build";


        const loaderUrl =
          buildUrl +
          "/CloverPit.loader.js";


        const config = {

          arguments: [],

          dataUrl:
            dataUrl,

          frameworkUrl:
            buildUrl +
            "/CloverPit.framework.js",

          codeUrl:
            wasmUrl,

          streamingAssetsUrl:
            "StreamingAssets",

          companyName:
            "Panik Arcade",

          productName:
            "CloverPit",

          productVersion:
            "1.3",

          showBanner:
            unityShowBanner
        };


        // --------------------------------------------------------
        // MOBILE
        // --------------------------------------------------------

        if (
          /iPhone|iPad|iPod|Android/i.test(
            navigator.userAgent
          )
        ) {

          const meta =
            document.createElement(
              "meta"
            );


          meta.name =
            "viewport";


          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";


          document
            .getElementsByTagName("head")[0]
            .appendChild(meta);
        }


        // --------------------------------------------------------
        // SHOW LOADING BAR
        // --------------------------------------------------------

        loadingBar.style.display =
          "block";


        // --------------------------------------------------------
        // CREATE UNITY LOADER SCRIPT
        // --------------------------------------------------------

        const script =
          document.createElement(
            "script"
          );


        script.src =
          loaderUrl;


        // --------------------------------------------------------
        // UNITY LOADER LOADED
        // --------------------------------------------------------

        script.onload =
          function () {

            console.log(
              "[CloverPit] Unity loader loaded."
            );


            if (
              typeof createUnityInstance !==
              "function"
            ) {

              throw new Error(
                "createUnityInstance() is not available."
              );
            }


            console.log(
              "[CloverPit] Starting Unity instance..."
            );


            createUnityInstance(

              canvas,

              config,

              function (progress) {

                const percent =
                  Math.round(
                    progress * 100
                  );


                progressBarFull.style.width =
                  percent + "%";


                loadingText.textContent =
                  `STARTING GAME... ${percent}%`;


                console.log(
                  `[CloverPit] Unity progress: ${percent}%`
                );

              }

            )

            .then(
              function (unityInstance) {

                console.log(
                  "[CloverPit] Unity started successfully!"
                );


                loadingBar.style.display =
                  "none";


                loadingText.style.display =
                  "none";

              }
            )

            .catch(
              function (error) {

                console.error(
                  "[CloverPit] Unity initialization failed:",
                  error
                );


                showError(
                  "Unity failed to start. Check console."
                );
              }
            );
          };


        // --------------------------------------------------------
        // UNITY LOADER FAILED
        // --------------------------------------------------------

        script.onerror =
          function () {

            console.error(
              "[CloverPit] Could not load:",
              loaderUrl
            );


            showError(
              "Could not load CloverPit.loader.js"
            );
          };


        // --------------------------------------------------------
        // IMPORTANT
        //
        // This MUST be inside the IIFE because `script`
        // is declared inside this function.
        // --------------------------------------------------------

        document.body.appendChild(
          script
        );


        console.log(
          "[CloverPit] Unity loader script added."
        );


      } catch (error) {

        // --------------------------------------------------------
        // GLOBAL ERROR HANDLER
        // --------------------------------------------------------

        console.error(
          "=========================================="
        );

        console.error(
          "[CloverPit] LOADING FAILED"
        );

        console.error(
          error
        );

        console.error(
          "=========================================="
        );


        showError(
          error.message ||
          "Unknown loading error."
        );
      }

    })();

  </script>

</body>
</html>
