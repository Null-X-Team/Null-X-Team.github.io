<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Cloud Auto-Saver</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .save-card {
            background: #141414;
            border: 1px solid #1f1f1f;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #8b00ff;
            font-size: 1.5rem;
        }
        #message {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #00c853;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="save-card">
        <h2>🔄 Global Live Cloud Saver</h2>
        <div style="font-size: 0.85rem; color: #555; text-transform: uppercase; margin-bottom: 5px;">Tracking Account:</div>
        <div id="player-display" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 20px;">Checking status...</div>

        <div style="display: flex; align-items: center; justify-content: center; margin-top: 20px;">
            <span id="status-dot" class="pulse" style="background-color: #aaa;"></span>
            <div id="message">Waiting for active player session...</div>
        </div>
    </div>

    <script type="module">
        const SUPABASE_URL = 'https://sczkzwfcpmngwglbydmu.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjemt6d2ZjcG1uZ3dnbGJ5ZG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDYxNTksImV4cCI6MjA5Njc4MjE1OX0.0O2pPwasyorT86MmJDoTccIlDKFFwRLoUIEZ_npDUII'; 

        const playerDisplay = document.getElementById('player-display');
        const statusDot = document.getElementById('status-dot');
        const msg = document.getElementById('message');

        // Look for the active logged-in user
        const loggedInUser = localStorage.getItem('chatUser');
        
        if (!loggedInUser) {
            playerDisplay.textContent = "Guest Mode (Auto-Save Disabled)";
            playerDisplay.style.color = "#ff4444";
            msg.textContent = "Log in to enable automatic cloud backups.";
            statusDot.style.backgroundColor = "#ff4444";
        } else {
            playerDisplay.textContent = loggedInUser;
            statusDot.style.backgroundColor = "#00c853";
            msg.textContent = "Live cloud saver active. Initializing loop...";
            
            // Start backing up immediately, then repeat every 5 seconds (5000ms)
            saveGameDataCloud();
            setInterval(saveGameDataCloud, 5000);
        }

        // --- THE 5-SECOND AUTOMATIC UPLOAD FUNCTION ---
        async function saveGameDataCloud() {
            if (!loggedInUser) return;

            try {
                // 1. Pack EVERYTHING currently inside local storage into a snapshot object
                let allLocalData = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    allLocalData[key] = localStorage.getItem(key);
                }

                const completeJsonString = JSON.stringify(allLocalData);

                // 2. Fire the object straight to Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/Gamesavedata`, {
                    method: 'POST',
                    headers: { 
                        'apikey': SUPABASE_KEY, 
                        'Authorization': `Bearer ${SUPABASE_KEY}`, 
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates' // Overwrites old data smoothly
                    },
                    body: JSON.stringify({ 
                        username: loggedInUser, 
                        save_string: completeJsonString,
                        updated_at: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    msg.textContent = "All site data successfully backed up to cloud!";
                    msg.style.color = "#00c853";
                    statusDot.style.backgroundColor = "#00c853";
                } else {
                    throw new Error("Database rejected sync script payload.");
                }
            } catch (err) {
                console.error("Global auto-save loop error:", err);
                msg.textContent = "Cloud save sync paused. Connection error.";
                msg.style.color = "#ffeb3b"; // Warning Yellow
                statusDot.style.backgroundColor = "#ffeb3b";
            }
        }
    </script>
</body>
</html>
