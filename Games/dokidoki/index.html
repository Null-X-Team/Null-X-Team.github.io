<head>

    <title>Doki Doki Literature Club! (Ren'Py Mod</title>

    <!-- iOS support -->

    <link rel="apple-touch-icon" href="icons/icon-96x96.png" sizes="96x96" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-128x128.png" sizes="128x128" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-144x144.png" sizes="144x144" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png" sizes="152x152" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-384x384.png" sizes="384x384" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-512x512.png" sizes="512x512" type="image/png">

    <meta name="theme-color" content="#000">

    <style>
        html {
            background: #444;
            font-family: sans-serif;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        #canvas,
        #overlayDiv {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0 none;
        }

        #canvas {
            background: #000;
        }

        #overlayDiv {
            pointer-events: none;
        }

        .visible {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.1s linear;
        }

        .hidden {
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s 0.25s, opacity 0.25s linear;
        }

        #statusDiv,
        #inputDiv {
            background: rgba(0, 0, 0, 0.75);
            width: 50%;
            margin: auto;
            min-width: 340px;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            border-radius: 0 0 5px 5px;
            box-sizing: border-box;
            z-index: 10;
        }

        #statusTextDiv {
            overflow: auto;
            max-height: 40vh;
            color: #ccc;
            font-size: 14px;
        }

        #statusProgress {
            display: none;
            width: 100%;
        }

        #inputDiv {
            width: 65%;
            padding-left: 10px;
            padding-right: 20px;
        }

        #inputPrompt {
            color: #eee;
            font-size: 150%;
            margin-bottom: 1em;
            margin-top: 1em;
        }

        #inputText {
            width: 100%;
            font-size: 175%;
            padding: 5px;
            background: inherit;
            color: #eee;
            box-sizing: border-box;
        }

        #inputText:focus {
            color: #fff;
        }

        #ContextContainer {
            position: absolute;
            left: 0;
            top: 0;
            color: white;
            z-index: 20;
        }

        #ContextContainer.shown {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0 0 5px 0;
        }

        #ContextButton {
            display: inline-block;
            text-decoration: none;
            color: lightgrey;
            font-size: xx-large;
            cursor: pointer;
            user-select: none;
            -moz-user-select: none;
            padding: 10px;
            opacity: 0.75;
        }

        #ContextButton:focus {
            outline: none;
            color: #fff;
            opacity: 1;
        }

        #ContextMenu a {
            text-decoration: none;
            color: lightgrey;
            background: #444;
            height: 48px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid lightgrey;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
            opacity: 1;
            box-sizing: border-box;
        }

        #ContextMenu a:hover {
            text-decoration: none;
            background: #666;
            color: #fff;
        }

        #presplash {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            margin: auto;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 5;
        }
    </style>
</head>

<body>

    <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1">
    </canvas>

    <div id="overlayDiv"></div>

    <img
        id="presplash"
        src="web-presplash.jpg"
        alt="Loading...">

    <div id="ContextContainer">

        <a
            id="ContextButton"
            href="#"
            aria-label="Menu">
            &#8801;
        </a>

        <br>

        <div id="ContextMenu" style="display: none;">

            <input
                id="ID_SavegamesImport"
                type="file"
                onchange="onSavegamesImport(this)"
                accept="application/zip"
                style="display:none">

            <a
                href="#"
                onclick="document.getElementById('ID_SavegamesImport').click(); return false;">
                Import Saves
            </a>

            <a
                href="#"
                onclick="onSavegamesExport(); return false;">
                Export Saves
            </a>

            <a
                href="#"
                onclick="FSDownload('/log.txt', 'text/plain'); return false;">
                Download Log
            </a>

            <a
                href="https://www.renpy.org/"
                target="_blank"
                rel="noopener noreferrer">
                Powered by Ren'Py
            </a>

        </div>
    </div>

    <div id="statusDiv" class="hidden">
        <div id="statusTextDiv"></div>
        <progress
            id="statusProgress"
            value="0"
            max="100">
        </progress>
    </div>

    <div id="inputDiv" class="hidden">
        <form id="inputForm">
            <div id="inputPrompt"></div>
            <input id="inputText" type="text">
        </form>
    </div>

    <script>
        alert(
            "Doki Doki Literature Club is a horror game. Please do not take this lightly. " +
            "Doki Doki Literature Club may not be suitable for you if you are affected by any " +
            "of the following themes: Depression, Suicide, Self-harm or Abuse. \n\n" +
            "These themes are not merely suggested, but are often portrayed as realistically " +
            "as possible, and thus may disturb you as if they were real. Furthermore, the above " +
            "list is not 100% exhaustive. For those with extra concern for their mental health, " +
            "our recommendation of the safest approach is to avoid playing Doki Doki Literature Club. " +
            "We trust that given your understanding of your own mental health, you are able to make " +
            "the decision that is right for you. Thank you for your consideration and for staying safe."
        );

        /*
         * Merge the individual game ZIP parts.
         */
        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {

                const buffers = [];

                function fetchPart(index) {

                    if (index >= fileParts.length) {

                        const mergedBlob = new Blob(buffers, {
                            type: "application/zip"
                        });

                        const mergedFileUrl =
                            URL.createObjectURL(mergedBlob);

                        console.log(
                            "Game ZIP merged successfully."
                        );

                        console.log(
                            "ZIP size:",
                            mergedBlob.size,
                            "bytes"
                        );

                        console.log(
                            "Blob URL:",
                            mergedFileUrl
                        );

                        resolve(mergedFileUrl);
                        return;
                    }

                    console.log(
                        "Loading:",
                        fileParts[index]
                    );

                    fetch(fileParts[index], {
                        cache: "no-cache"
                    })
                        .then(response => {

                            if (!response.ok) {
                                throw new Error(
                                    "Failed to load " +
                                    fileParts[index] +
                                    " - HTTP " +
                                    response.status
                                );
                            }

                            return response.arrayBuffer();
                        })
                        .then(data => {

                            console.log(
                                fileParts[index],
                                "loaded:",
                                data.byteLength,
                                "bytes"
                            );

                            if (data.byteLength === 0) {
                                throw new Error(
                                    fileParts[index] +
                                    " is empty."
                                );
                            }

                            buffers.push(data);

                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }

                fetchPart(0);
            });
        }

        /*
         * Generate the game ZIP part filenames.
         */
        function getParts(file, start, end) {

            const parts = [];

            for (let i = start; i <= end; i++) {
                parts.push(
                    file + ".part" + i
                );
            }

            return parts;
        }

        /*
         * Load a JavaScript file and wait until
         * it has completely loaded.
         */
        function loadScript(src) {

            return new Promise((resolve, reject) => {

                console.log(
                    "Loading script:",
                    src
                );

                const script =
                    document.createElement("script");

                script.src = src;
                script.type = "text/javascript";

                script.onload = () => {

                    console.log(
                        "Successfully loaded:",
                        src
                    );

                    resolve();
                };

                script.onerror = () => {

                    reject(
                        new Error(
                            "Failed to load script: " +
                            src
                        )
                    );
                };

                document.body.appendChild(script);
            });
        }

        /*
         * Show a readable error instead of
         * leaving the user on a loading screen.
         */
        function showLoadingError(error) {

            console.error(
                "GAME STARTUP ERROR:",
                error
            );

            const statusDiv =
                document.getElementById(
                    "statusDiv"
                );

            const statusTextDiv =
                document.getElementById(
                    "statusTextDiv"
                );

            statusDiv.classList.remove(
                "hidden"
            );

            statusDiv.classList.add(
                "visible"
            );

            statusTextDiv.innerHTML =
                "<strong>Game failed to start.</strong>" +
                "<br><br>" +
                String(
                    error.message || error
                ) +
                "<br><br>" +
                "Open the browser console for more information.";
        }

        /*
         * Start the game.
         */
        async function startGame() {

            try {

                console.log(
                    "Starting game loader..."
                );

                /*
                 * Merge:
                 *
                 * game.zip.part1
                 * game.zip.part2
                 * game.zip.part3
                 * game.zip.part4
                 */
                const zipUrl =
                    await mergeFiles(
                        getParts(
                            "game.zip",
                            1,
                            4
                        )
                    );

                window.gameZipURL = zipUrl;

                console.log(
                    "window.gameZipURL =",
                    window.gameZipURL
                );

                /*
                 * Register service worker.
                 */
                if ("serviceWorker" in navigator) {

                    try {

                        if (
                            !navigator.serviceWorker
                                .controller
                        ) {

                            await navigator.serviceWorker.register(
                                "./service-worker.js",
                                {
                                    updateViaCache: "all"
                                }
                            );

                            console.log(
                                "Service worker registered successfully."
                            );

                        } else {

                            console.log(
                                "Service worker already controlling page."
                            );
                        }

                    } catch (error) {

                        /*
                         * Don't prevent the game from
                         * attempting to start if the
                         * service worker fails.
                         */
                        console.warn(
                            "Service worker registration failed:",
                            error
                        );
                    }
                }

                /*
                 * IMPORTANT:
                 *
                 * renpy-pre.js must finish loading
                 * before renpy.js starts.
                 */
                await loadScript(
                    "renpy-pre.js"
                );

                console.log(
                    "renpy-pre.js finished."
                );

                /*
                 * Load Ren'Py itself.
                 */
                await loadScript(
                    "renpy.js"
                );

                console.log(
                    "renpy.js finished."
                );

                console.log(
                    "All game scripts loaded."
                );

            } catch (error) {

                showLoadingError(
                    error
                );
            }
        }

        /*
         * Menu button.
         */
        document
            .getElementById("ContextButton")
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    const container =
                        document.getElementById(
                            "ContextContainer"
                        );

                    const menu =
                        document.getElementById(
                            "ContextMenu"
                        );

                    if (
                        menu.style.display ===
                        "none"
                    ) {

                        menu.style.display =
                            "block";

                        container.classList.add(
                            "shown"
                        );

                    } else {

                        menu.style.display =
                            "none";

                        container.classList.remove(
                            "shown"
                        );
                    }
                }
            );

        /*
         * Start the game loader.
         */
        startGame();
    </script>

</body>

</html>
