<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Ad-Free</title>
    <script src="ad-blocker.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="game-frame" frameborder="0" allow="autoplay; fullscreen"></iframe>
    <script>
        // Load the actual game file
        const gameName = new URLSearchParams(window.location.search).get('game');
        if (gameName) {
            document.getElementById('game-frame').src = gameName + '/index.html';
        }
    </script>
</body>
</html>
