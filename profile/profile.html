<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="profile-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Settings</h2>
            </div>
            <div class="sidebar-menu">
                <a href="https://glaxyias.github.io" class="menu-item">
                    <span class="icon">🏠</span> Home
                </a>
                <a href="../chat/chat.html" class="menu-item">
                    <span class="icon">💬</span> Chat Server
                </a>
                <div class="menu-item active">
                    <span class="icon">👤</span> Profile Card
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="profile-card">
                <div class="avatar-upload-section">
                    <img id="pfp-preview" src="https://Glaxyias.github.io/imgs/download.jpeg" alt="Profile Picture">
                    <div class="upload-inputs">
                        <label for="pfp-file-input">Upload Profile Picture</label>
                        <input type="file" id="pfp-file-input" accept="image/*">
                    </div>
                </div>

                <div class="profile-details-section">
                    <div class="input-group">
                        <label>Username</label>
                        <div class="username-static-display">
                            <span id="display-username">Loading...</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="bio-input">About Me / Bio</label>
                        <textarea id="bio-input" placeholder="Tell the community a little bit about yourself..." maxlength="250"></textarea>
                    </div>

                    <div class="meta-info">
                        <div class="info-row">
                            <span>Account Holder:</span>
                            <strong id="info-username">-</strong>
                        </div>
                        <div class="info-row">
                            <span>Joined Community:</span>
                            <span id="join-date">-</span>
                        </div>
                    </div>

                    <div class="actions-row">
                        <button id="save-profile-btn" class="save-btn">Save Changes</button>
                        <span id="save-status"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="profile.js"></script>
</body>
</html>
