          + "<div style=\"text-align:center;padding:40px\"><h1>SITE LOCKED</h1><p>Unauthorized host.</p></div></body></html>";
        document.open();
        document.write(html);
        document.close();
      } catch (e) {}
      try { Object.freeze(document); } catch (e) {}
    })();
  </script>

    .driver-overlay {

    .driver-popover-description {

    .driver-popover-footer {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      margin-top: 10px !important;
    }

    .driver-popover-progress-text {
      font-size: 0.75rem !important;
      color: #b056ff !important;
      font-weight: bold !important;
    }

    .driver-popover-navigation-btns {
      display: flex !important;
      gap: 6px !important;
    }

    .driver-popover-prev-btn,
    .driver-popover-next-btn,
    .driver-popover-close-btn {
      background: #8b00ff !important;
      color: #ffffff !important;

      font-weight: bold !important;

    }

    .driver-popover-prev-btn:hover,
    .driver-popover-next-btn:hover {

    .driver-popover-close-btn {

    .driver-popover-arrow {

      border: 5px solid transparent;

    .driver-popover-arrow-side-left { border-right-color: #8b00ff !important; }
    .driver-popover-arrow-side-right { border-left-color: #8b00ff !important; }
    .driver-popover-arrow-side-top { border-bottom-color: #8b00ff !important; }
    .driver-popover-arrow-side-bottom { border-top-color: #8b00ff !important; }

    /* Absolute overlay positioning for the countdown clock container */
    .countdown-overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 6, 20, 0.88);
      backdrop-filter: blur(5px);
      z-index: 100; /* Coordinated above featured section graphics */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      user-select: none;
    }

    .countdown-title {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 22px;
      color: #b056ff;
      text-shadow: 0 0 12px rgba(139, 0, 255, 0.6);
      font-weight: 700;
    }

    /* Fixed Matrix Clock Grid Layout */
    .flip-clock {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .flip-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flip-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #928a9f;
      margin-top: 10px;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    /* Fixed unified segment card wrapper */
    .matrix-card {
      position: relative;
      background: #1e1131;
      border: 1px solid rgba(139, 0, 255, 0.3);
      border-radius: 6px;
      width: 72px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    /* Horizontal dividing line decoration over unified grid matrix */
    .matrix-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    /* Single fluid text baseline container avoiding cuts */
    .matrix-value {
      font-family: monospace;
      font-size: 2.3rem;
      font-weight: 800;
      color: #ffffff;
      z-index: 1;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s ease-on;
    }

    /* Dynamic pulsing refresh keyframe */
    .matrix-card.pulse .matrix-value {
      animation: matrixPop 0.25s ease-out;
    }

    @keyframes matrixPop {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); color: #b056ff; opacity: 1; }
      100% { transform: scale(1); color: #ffffff; }
    }

    /* Custom Handler Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 3, 20, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-content {
      background-color: #12091c;
      border: 1px solid #8b00ff;
      border-radius: 16px;
      padding: 30px;
      width: 320px;
      box-shadow: 0 0 35px rgba(139, 0, 255, 0.45);
      text-align: center;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;

    .modal-content h2 {
      margin-top: 0;
      font-size: 1.4rem;

    .modal-content p {

      font-size: 0.85rem;

      margin-bottom: 20px;
    }

    .modal-form-group {

      text-align: left;
      margin-bottom: 18px;

    .modal-form-group label {

    .modal-form-group input {

      padding: 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;

    }

    .modal-form-group input:focus {

    .modal-submit-btn {

    .modal-msg-box {

    }

    .modal-msg-box.error { color: #ff4d4d; }

    /* --- WARNING MODAL STYLING --- */
