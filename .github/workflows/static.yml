# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Triggers the deployment instantly every time you push to the main branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and commit file writes
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job, since we're just deploying; now handling automation tasks
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so the force-push knows exactly what it is replacing
          fetch-depth: 0

      # --- AUTOMATED VERSION STAMP INJECTION ---
      - name: Generate Live Timestamp and Overwrite version.json
        run: |
          TIMESTAMP=$(date +%s%3N)
          echo "{\"version\": $TIMESTAMP}" > version.json
          echo "Generated live system build version: $TIMESTAMP"

      - name: Commit version.json back to repo
        run: |
          # Git requires a committer identity, even when amending. 
          # The original AUTHOR of the commit will remain you!
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add version.json
          
          # Commit only if changed
          if ! git diff-index --quiet HEAD; then
            # Amend the previous commit, keeping the original message and author intact
            git commit --amend --no-edit
            
            # Force push the amended commit back to the main branch
            git push --force origin HEAD:main
          fi
      # ------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository contents
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
