name: Nx Dual Database Upkeep Bot

on:
  schedule:
    # Runs automatically every single day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Lets you manually test it anytime from the Actions tab

jobs:
  ping-databases:
    runs-on: ubuntu-latest
    steps:
      # Supabase keep-alive removed — project migrated to Turso on Vercel.
      # Optional: ping the Vercel API health endpoints so the deployment stays warm.
      - name: Warm Turso API (Vercel)
        run: |
          echo "[Upkeep Bot] Warming Turso API routes on Vercel..."
          BASE="https://null-x-team-github-io.vercel.app/api"
          for path in users messages load; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/$path" || true)
            echo "  GET /$path -> HTTP $code"
          done
          echo "[Upkeep Bot] Done."
