name: NxOS Database Upkeep Bot

on:
  schedule:
    # This tells GitHub to run this job automatically every 3 days at midnight
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to press a button to test it manually

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Current Counter and Update Database
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "[Upkeep Bot] Connecting to NxOS Subsystem..."
          
          # 1. Fetch the row where id=1
          RESPONSE=$(curl -s -X GET "$SB_URL/rest/v1/botupkeep?id=eq.1" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "apikey: $SB_KEY")
            
          # 2. Parse out the current number using basic string extraction
          CURRENT_NUM=$(echo "$RESPONSE" | grep -o '"counter":[0-9]*' | cut -d: -f2)
          
          if [ -z "$CURRENT_NUM" ]; then
            echo "Error: Could not read counter. Make sure row id=1 exists in your table!"
            exit 1
          fi
          
          # 3. Add 1 to the value
          NEW_NUM=$((CURRENT_NUM + 1))
          echo "[Upkeep Bot] Current counter is $CURRENT_NUM. Upgrading to $NEW_NUM."
          
          # 4. Update the table with the new value
          curl -s -X PATCH "$SB_URL/rest/v1/botupkeep?id=eq.1" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "apikey: $SB_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"counter\": $NEW_NUM}"
            
          echo "[Upkeep Bot] Database transaction successful. Server refreshed."
