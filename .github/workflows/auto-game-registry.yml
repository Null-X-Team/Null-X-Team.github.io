name: Auto-Update Game Registry

on:
  push:
    paths:
      - 'Games/**'
  workflow_dispatch:

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smart Update main.js
        run: |
          python3 << 'EOF'
          import os
          import re
          from pathlib import Path

          main_js_path = Path("JS/main.js")
          
          # Read existing main.js
          with open(main_js_path, "r") as f:
              main_content = f.read()

          # Find existing game URLs to avoid duplicates
          existing_urls = re.findall(r'url:\s*["\']([^"\']+)["\']', main_content)
          existing_urls_normalized = [u.lower().replace("\\", "/") for u in existing_urls]

          games_dir = Path("Games")
          new_entries = []
          image_exts = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg'}
          
          # Scan the Games folder
          for game_folder in sorted(games_dir.iterdir()):
              if not game_folder.is_dir() or game_folder.name.startswith('.'):
                  continue
              
              # Find HTML file
              html_file = None
              for f in game_folder.rglob("*.html"):
                  if f.name.lower() in ["index.html", "game.html", "main.html"] or "index" in f.name.lower():
                      html_file = f
                      break
              if not html_file:
                  html_files = list(game_folder.rglob("*.html"))
                  if html_files:
                      html_file = html_files[0]
              if not html_file:
                  continue
              
              url_path = str(html_file).replace("\\", "/")
              if not url_path.startswith("../"):
                  url_path = "../" + url_path
              
              # If the game is already in main.js, skip it entirely!
              if url_path.lower() in existing_urls_normalized:
                  continue
              
              # Process NEW games only
              image_file = None
              for f in game_folder.rglob("*"):
                  if f.suffix.lower() in image_exts:
                      image_file = f
                      break
              
              folder_name = game_folder.name
              game_id = re.sub(r'[^a-zA-Z0-9]', '_', folder_name.lower())
              if game_id.startswith('_'):
                  game_id = game_id[1:]
              if not game_id:
                  game_id = f"game_new_{len(new_entries)}"
              
              image_path = None
              if image_file:
                  image_path = str(image_file).replace("\\", "/")
                  if not image_path.startswith("../"):
                      image_path = "../" + image_path
              
              # Build the new JS string
              js_line = f'  {{ id: "{game_id}", title: "{folder_name}", url: "{url_path}", desc: "Coming soon. Edit this description in main.js.", popular: true'
              if image_path:
                  js_line += f', image: "{image_path}"'
              js_line += " },"
              new_entries.append(js_line)

          # Inject new games right before the closing bracket ];
          if new_entries:
              pattern = r'(let _0xData = \[.*?)(];)'
              
              def insert_new_games(match):
                  # Keeps everything that was there, adds a newline, the new games, and closes it
                  return match.group(1) + "\n" + "\n".join(new_entries) + "\n];"
              
              updated_content = re.sub(pattern, insert_new_games, main_content, flags=re.DOTALL)
              
              with open(main_js_path, "w") as f:
                  f.write(updated_content)
              print(f"Successfully added {len(new_entries)} new game(s) to main.js!")
          else:
              print("No new games found. Everything is up to date!")
          EOF

      - name: Verify Deletions
        id: verify
        run: |
          # Use git to check if any lines were deleted from main.js
          DELETIONS=$(git diff --numstat JS/main.js | awk '{print $2}')
          
          if [ -z "$DELETIONS" ]; then
            echo "has_deletions=false" >> $GITHUB_OUTPUT
          elif [ "$DELETIONS" -gt 0 ]; then
            echo "has_deletions=true" >> $GITHUB_OUTPUT
            echo "PR_TITLE=NEEDS MANUAL REVIEW: Code was deleted" >> $GITHUB_ENV
            echo "PR_BODY=The automated script deleted lines in JS/main.js. Please review manually to ensure no game data was accidentally removed." >> $GITHUB_ENV
          else
            echo "has_deletions=false" >> $GITHUB_OUTPUT
            echo "PR_TITLE=Auto-add new games to registry" >> $GITHUB_ENV
            echo "PR_BODY=Detected new games in the \`Games\` folder. They have been appended safely to the bottom of the list." >> $GITHUB_ENV
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "Auto-update game registry"
          title: ${{ env.PR_TITLE || 'Auto-add new games to registry' }}
          body: ${{ env.PR_BODY || 'Checking for updates...' }}
          branch: feature/auto-game-registry
          base: main
          delete-branch: true

      - name: Auto-Merge Pull Request
        if: steps.cpr.outputs.pull-request-operation == 'created' && steps.verify.outputs.has_deletions == 'false'
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
