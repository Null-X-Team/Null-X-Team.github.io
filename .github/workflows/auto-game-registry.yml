name: Auto-Update Game Registry

on:
  push:
    paths:
      - 'Games/**'
  workflow_dispatch:

jobs:
  update-registry:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smart Update main.js
        id: smart_update
        run: |
          python3 << 'EOF'
          import os
          import re
          from pathlib import Path

          main_js_path = Path("JS/main.js")
          games_dir = Path("Games")

          if not main_js_path.exists():
              raise FileNotFoundError("JS/main.js was not found.")

          if not games_dir.exists():
              raise FileNotFoundError("Games folder was not found.")

          with open(main_js_path, "r", encoding="utf-8") as f:
              main_content = f.read().replace("\r\n", "\n")

          existing_urls = re.findall(
              r'url:\s*["\']([^"\']+)["\']',
              main_content
          )

          existing_urls_normalized = {
              url.lower().replace("\\", "/")
              for url in existing_urls
          }

          image_exts = {
              ".jpg", ".jpeg", ".png", ".gif",
              ".webp", ".bmp", ".svg"
          }

          entry_file_names = {
              "index.html", "game.html", "main.html"
          }

          excluded_folder_names = {
              "gamesavedata"
          }

          excluded_urls = {
              "../games/gamesavedata/gsd.html",
              "../games/gamesavedata/auto-save.js"
          }

          new_entries = []
          updates_made = 0
          lines = main_content.split("\n")
          seen_urls_this_run = set()

          html_candidates = sorted(
              file
              for file in games_dir.rglob("*.html")
              if file.is_file()
          )

          for html_file in html_candidates:
              relative_to_games = html_file.relative_to(games_dir)
              relative_parts = relative_to_games.parts

              if not relative_parts:
                  continue

              if any(
                  part.lower() in excluded_folder_names
                  for part in relative_parts
              ):
                  continue

              file_name = html_file.name.lower()

              is_game_entry = (
                  file_name in entry_file_names
                  or "index" in file_name
              )

              if not is_game_entry:
                  continue

              url_path = "../" + html_file.as_posix()
              normalized_url = url_path.lower().replace("\\", "/")

              if normalized_url in excluded_urls:
                  continue

              if normalized_url in seen_urls_this_run:
                  continue

              seen_urls_this_run.add(normalized_url)

              game_folder = html_file.parent
              folder_parts = game_folder.relative_to(games_dir).parts

              if not folder_parts:
                  continue

              title_parts = [
                  part.replace("_", " ").replace("-", " ")
                  for part in folder_parts
              ]

              folder_name = " - ".join(title_parts)

              image_file = next(
                  (
                      file
                      for file in sorted(game_folder.rglob("*"))
                      if file.is_file()
                      and file.suffix.lower() in image_exts
                  ),
                  None
              )

              image_path = None

              if image_file:
                  image_path = "../" + image_file.as_posix()

              if normalized_url in existing_urls_normalized:
                  if image_path:
                      for i, line in enumerate(lines):
                          url_exists_on_line = (
                              f'"{url_path}"' in line
                              or f"'{url_path}'" in line
                          )

                          if url_exists_on_line and "image:" not in line:
                              last_brace = line.rfind("}")

                              if last_brace != -1:
                                  lines[i] = (
                                      line[:last_brace]
                                      + f', image: "{image_path}" '
                                      + line[last_brace:]
                                  )

                                  updates_made += 1

                  continue

              game_id = re.sub(
                  r"[^a-zA-Z0-9]+",
                  "_",
                  "_".join(folder_parts).lower()
              ).strip("_")

              if not game_id:
                  game_id = f"game_new_{len(new_entries)}"

              js_line = (
                  f'  {{ id: "{game_id}", '
                  f'title: "{folder_name}", '
                  f'url: "{url_path}", '
                  f'desc: "Coming soon. Edit this description in main.js.", '
                  f'popular: true'
              )

              if image_path:
                  js_line += f', image: "{image_path}"'

              js_line += " },"

              new_entries.append(js_line)

          main_content = "\n".join(lines)

          if new_entries or updates_made > 0:
              if new_entries:
                  pattern = r"(let _0xData = 

\[)([\s\S]*?)(];)"

                  def insert_new_games(match):
                      return (
                          match.group(1)
                          + "\n"
                          + "\n".join(new_entries)
                          + "\n];"
                      )

                  updated_content = re.sub(
                      pattern,
                      insert_new_games,
                      main_content,
                      flags=re.DOTALL
                  )
              else:
                  updated_content = main_content

              with open(main_js_path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(updated_content)

              print(
                  f"Successfully added {len(new_entries)} new game(s) "
                  f"and updated {updates_made} existing image(s)."
              )
          else:
              print("No new games or images found. Everything is up to date.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"updates_made={updates_made}\n")
              f.write(f"new_games={len(new_entries)}\n")
          EOF

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "Auto-update game registry"
          title: "Auto-add new games to registry"
          body: "Automatically updated game registry."
          branch: feature/auto-game-registry
          base: main
          delete-branch: true

      - name: Auto-Merge Pull Request
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --merge --delete-branch "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
