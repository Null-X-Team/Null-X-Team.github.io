<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Null X - Settings</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="themes/themes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="Games/GameSaveData/auto-save.js"></script>
</head>
<body style="background: #0b0512; color: white; padding: 40px 20px; font-family: sans-serif;">

  <div class="settings-standalone-container" style="max-width: 800px; margin: 0 auto; background: rgba(18, 9, 28, 0.95); border: 1px solid #8b00ff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div>
        <h1 class="glow" style="margin: 0; font-size: 2.2rem; letter-spacing: 1px; color: #fff;">Settings</h1>
        <p class="subtitle" style="margin: 5px 0 0; color: #aaa; font-size: 0.95rem;">Personalize your Null_X dashboard</p>
      </div>
      <a href="../index.html" id="return-home-btn" style="text-decoration: none; background: rgba(255,255,255,0.06); border: 1px solid rgba(139, 0, 255, 0.4); color: white; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(139, 0, 255, 0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.06)'">
        <i class="fas fa-arrow-left"></i> Return Home
      </a>
    </div>

    <hr class="settings-divider" style="border: 0; height: 1px; background: linear-gradient(to right, #8b00ff, transparent); margin: 20px 0 30px 0;">

    <p style="color:#fbbf24;background:rgba(251,191,36,0.1);padding:12px;border-radius:6px;border:1px solid rgba(251,191,36,0.3);margin-bottom:20px;font-size:0.9rem;">
      Settings UI is temporarily slim while the full panel is restored. <strong>About Me</strong> and <strong>Terms of Service</strong> load below. Full theme/panic controls: use the in-dashboard Settings modal from Home if needed.
    </p>

    <div id="nx-about-tos-slot"></div>

  </div>

  <script>
  (function(){
    var slot = document.getElementById('nx-about-tos-slot');
    if (!slot) return;
    fetch('about-tos-panel.html').then(function(r){ return r.text(); }).then(function(html){
      slot.outerHTML = html;
    }).catch(function(e){ console.error(e); });
  })();
  </script>
  <script type="module" src="JS/main.js"></script>
  <script src="themes/themes.js"></script>
  <script src="../JS/music.js"></script>
  <script src="../customcrosshair/loader.js"></script>
  <script src="homescreen-pref.js"></script>
</body>
</html>
